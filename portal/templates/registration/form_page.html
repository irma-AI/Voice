{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold">{% block heading %}{% endblock %}</h1>
{% block intro %}{% endblock %}
<form method="post" class="mt-6 space-y-4">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="rounded bg-stone-900 px-4 py-2 text-white">{% block button %}Save{% endblock %}</button>
</form>
{% block after %}{% endblock %}
{% endblock %}
