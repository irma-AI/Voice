{% extends "base.html" %}
{% block content %}
<div class="max-w-md">
<h1 class="text-4xl sm:text-[3.5rem] sm:leading-none">{% block heading %}{% endblock %}</h1>
{% block intro %}{% endblock %}
<form method="post" class="mt-8 space-y-5">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="pill mt-2">{% block button %}Save{% endblock %}</button>
</form>
{% block after %}{% endblock %}
</div>
{% endblock %}
