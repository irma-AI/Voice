{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Voice Portal{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'portal/portal.css' %}">
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
      <a href="{% url 'home' %}" class="font-semibold">Voice Portal</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-sm text-stone-600 underline">Log out</button></form>
      {% endif %}
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 py-10">{% block content %}{% endblock %}</main>
</body>
</html>
