{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1322">
  <title>{% block title %}Voice Portal{% endblock %}</title>
  <link rel="preload" href="{% static 'portal/fonts/Geist-Variable.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'portal/portal.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}
  <header>
    <nav class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-gutter py-5" aria-label="Portal">
      <a href="{% url 'home' %}" class="flex items-baseline gap-2 no-underline"><span class="font-serif text-3xl leading-none tracking-[-0.01em]">Voice</span> <span class="text-xs font-medium tracking-label text-foam-muted uppercase">Portal</span></a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="rounded-pill px-3 py-2 text-sm text-foam-muted underline decoration-foam-faint underline-offset-[0.3em] hover:text-foam hover:decoration-cable-light">Log out</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-gutter pt-8 pb-16 sm:pt-14">{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
