# Every job calls make targets, so CI runs exactly what agents and people run locally.
# Require only "ci-summary" in the ruleset (.github/rulesets/main.json): it runs even when
# other jobs fail or are skipped, and passes only when each of them passed.
name: CI

on:
  pull_request:
    # labeled/unlabeled: the fenced-paths guard reads the PR's labels, so a label change re-runs CI. edited: ticket-required reads the PR text.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]
  # The merge queue (ruleset main) tests each PR on top of main and the PRs ahead of it before it merges.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    name: make ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        targets: ["lint typecheck guards generate-check", test, test-db, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # guards that compare with the base branch need its history
      - uses: ./.github/actions/setup
      - run: make $TARGETS
        env:
          TARGETS: ${{ matrix.targets }}
          # GUARD_EVENT=merge_group: the guards that read PR text or labels skip with a note (scripts/base-config.js); the rest compare with the queue's base.
          GUARD_EVENT: ${{ github.event_name }}
          GUARD_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || '' }}
          GUARD_HEAD: ${{ github.event.pull_request.head.sha || '' }} # the PR's own tip: the checkout is a synthetic merge commit
          GUARD_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # ticket-required guard: the PR text names the ticket; the Linear key (read-only, set by Petter) goes only to the guards leg.
          # Empty on merge_group, which carries no PR text: the PR's own run checked it, and no-claude-identity still reads every commit in the group.
          GUARD_PR_TEXT: ${{ github.event_name == 'pull_request' && format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body) || '' }}
          LINEAR_API_TOKEN: ${{ matrix.targets == 'lint typecheck guards generate-check' && secrets.LINEAR_API_TOKEN || '' }}

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make workflow-lint
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (read-only: the workflow's permissions)

  ci-summary:
    name: ci-summary
    if: always()
    needs: [make, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Every job did what it should
        env:
          MAKE: ${{ needs.make.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
        run: |
          echo "make: $MAKE, workflow-lint: $WORKFLOW_LINT"
          [ "$MAKE" = success ] && [ "$WORKFLOW_LINT" = success ]
