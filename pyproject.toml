[project]
name = "voice"
version = "0.0.0"
description = "The voice core: connects a phone or browser call to a live AI voice model and runs the call."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pipecat-ai[cli,google,runner,webrtc]==1.12.0",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = [".claude", "docs", "scripts/checks/fixtures"]  # vendored skills, template docs and guard fixtures that break rules on purpose

[tool.pyright]
include = ["voice", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
