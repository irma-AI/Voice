# A real Postgres for `make test-db`. The image comes from Google's Docker Hub mirror because
# anonymous Docker Hub pulls are rate-limited in cloud sessions (429).
services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment: { POSTGRES_PASSWORD: test, POSTGRES_DB: portal_test }
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 1s, retries: 30 }
