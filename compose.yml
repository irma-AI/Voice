# The Portal's local Postgres for `make portal-up`. Same mirror as compose.test.yml.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: portal }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 1s, retries: 30 }
volumes:
  pgdata:
