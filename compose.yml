# The Portal's local Postgres for `make portal-up`, on a Voice-only port (5432 is every other Postgres's default; tests use 55432). Same mirror as compose.test.yml.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: portal }
    ports: ["127.0.0.1:55431:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 1s, retries: 30 }
volumes:
  pgdata:
