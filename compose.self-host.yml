# Self-host on one machine: the core, the Portal and Postgres from one command (README § Self-host).
# Values come from .env (copy .env.example); the services listen on this machine only.
name: voice-self-host
services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfhost}
      POSTGRES_DB: portal
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 1s, retries: 30 }
  portal:
    build: { context: ., dockerfile: Dockerfile.portal }
    depends_on: { postgres: { condition: service_healthy } }
    # ponytail: the Portal runs in its local mode (mail prints to its log, Django's dev server): fine on one machine, not for a public address. Production mode needs the values listed in .env.example.
    command: ["sh", "-c", "python -m django migrate --noinput && exec python -m django runserver 0.0.0.0:8000"]
    environment:
      ENVIRONMENT: local
      DEBUG: "1"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-selfhost}@postgres:5432/portal
      PORTAL_URL: http://localhost:8000
      CORE_URL: http://localhost:7860
      CORE_SECRET: ${CORE_SECRET:?set CORE_SECRET in .env (copy .env.example)}
      ALLOW_LOCAL_MODULES: ${ALLOW_LOCAL_MODULES:-}
      TIME_ZONE: ${TIME_ZONE:-UTC}
    ports: ["127.0.0.1:8000:8000"]
  core:
    build: { context: ., target: core }
    depends_on: [portal]
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?add your Google key to .env (aistudio.google.com)}
      SETTINGS_URL: http://portal:8000
      CORE_SECRET: ${CORE_SECRET:?set CORE_SECRET in .env (copy .env.example)}
      ALLOW_LOCAL_MODULES: ${ALLOW_LOCAL_MODULES:-}
      BILLING_API_KEY: ${BILLING_API_KEY:-}
      PORT: "7860"
    ports: ["127.0.0.1:7860:7860"]
volumes:
  pgdata:
