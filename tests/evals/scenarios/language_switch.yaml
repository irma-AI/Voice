# A Swedish question, then the Caller asks for English. The checks read the call record.
user:
  modality: audio
judge:
  modality: audio
  transcription:  # the format requires it; only built for `response` expectations, which we don't use
    service: moonshine
name: language_switch
scenarios:
  - name: language_switch
    turns:
      - expect:
          - event: bot_started_speaking
            within_ms: 15000
          - event: bot_stopped_speaking
            within_ms: 30000
      - user: "Vilka öppettider har ni?"
        audio: ../audio/opening_hours_sv.wav
        expect:
          - event: bot_started_speaking
            within_ms: 15000
          - event: bot_stopped_speaking  # the whole reply, not its first word
            within_ms: 30000
      - user: "Sorry, could you say that in English?"
        audio: ../audio/switch_to_english_en.wav
        expect:
          - event: bot_started_speaking
            within_ms: 15000
          - event: bot_stopped_speaking  # the whole reply, not its first word
            within_ms: 30000
