# The Business's facts have no opening hours; its Module has an Action that gives them. The Caller asks the hours and the agent must call the Action and use its answer. The checks read the call record.
user:
  modality: audio
judge:
  modality: audio
  transcription:  # the format requires it; only built for `response` expectations, which we don't use
    service: moonshine
name: module_hours
scenarios:
  - name: module_hours
    turns:
      - expect:
          - event: bot_started_speaking
            within_ms: 15000
          - event: bot_stopped_speaking
            within_ms: 30000
      - user: "Vilka öppettider har ni?"
        audio: ../audio/opening_hours_sv.wav
        expect:
          - event: bot_started_speaking
            within_ms: 15000
          - event: bot_stopped_speaking  # the whole reply, not its first word
            within_ms: 30000
