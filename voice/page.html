<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* Design tokens: a copy of portal/static/portal/tokens.css (the source; the core may not import the Portal, ADR 0002).
     tests/test_design_tokens.py fails when they differ. */
  :root {
    --color-blue-hour: #1A2A44;
    --color-deep-sea: #0B1322;
    --color-cable-light: #F5D9A8;
    --color-foam: #FFFFFF;
    --color-granite: #3A3F47;
    --color-foam-muted: rgb(255 255 255 / 0.72);
    --color-foam-faint: rgb(255 255 255 / 0.5);
    --font-serif: "Newsreader", Georgia, serif;
    --font-sans: "Schibsted Grotesk", system-ui, sans-serif;
    --text-xs: 0.75rem;
    --text-xs--line-height: 1.4;
    --text-sm: 0.875rem;
    --text-sm--line-height: 1.45;
    --text-base: 1rem;
    --text-base--line-height: 1.5;
    --text-lg: 1.125rem;
    --text-lg--line-height: 1.5;
    --text-xl: 1.375rem;
    --text-xl--line-height: 1.3;
    --text-2xl: 1.75rem;
    --text-2xl--line-height: 1.15;
    --text-3xl: 2.25rem;
    --text-3xl--line-height: 1.1;
    --text-4xl: 3rem;
    --text-4xl--line-height: 1.02;
    --text-display: clamp(3.25rem, 6.4vw, 5.75rem);
    --text-display--line-height: 0.98;
    --tracking-display: -0.02em;
    --tracking-label: 0.12em;
    --spacing: 0.25rem;
    --spacing-gutter: clamp(1.25rem, 5vw, 4rem);
    --radius-sm: 0.25rem;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-pill: 9999px;
  }
  /* The faces are served by the core (voice/static/fonts, a copy of the Portal's; tests/test_design_tokens.py holds them equal). */
  @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 300 500; font-display: swap; src: url("/fonts/Newsreader-Variable.woff2") format("woff2"); }
  @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 900; font-display: swap; src: url("/fonts/SchibstedGrotesk-Variable.woff2") format("woff2"); }
  /* Voice's own look. A Business's Theme (below) swaps the action and the live light for its accent,
     already adjusted by the Portal so its text colour reads on it (WCAG 2.2 AA). */
  :root {
    --action: var(--color-foam);
    --on-action: var(--color-deep-sea);
    --action-hover: var(--color-cable-light);
    --live: var(--color-cable-light);
    color-scheme: dark;
    -webkit-text-size-adjust: 100%;
  }
</style>
<style>__THEME__</style>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--color-deep-sea) radial-gradient(120% 90% at 70% 0%, var(--color-blue-hour) 0%, var(--color-deep-sea) 78%) fixed;
    color: var(--color-foam);
    font: 400 var(--text-base)/var(--text-base--line-height) var(--font-sans);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
  }
  ::selection { background: var(--color-cable-light); color: var(--color-deep-sea); }
  :focus-visible { outline: 2px solid var(--color-cable-light); outline-offset: 4px; }

  /* One column the height of the panel (32rem at most on the Business's site): the Live transcript takes the
     slack, so the button stays in view in every state. Opened on its own, the column stops at 40rem. */
  .panel {
    width: 100%;
    max-width: 26rem;
    height: min(100dvh, 40rem);
    overflow-y: auto;
    padding: calc(var(--spacing) * 5);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: calc(var(--spacing) * 3);
  }
  .panel > * { flex: none; }

  /* The page's one heading: who the Caller is talking to, for a screen reader's heading list. */
  .brand { margin: 0; font: inherit; min-height: 2.5rem; display: flex; align-items: center; justify-content: center; }
  .brand img { display: block; max-height: 2.5rem; max-width: 12rem; object-fit: contain; }
  .brand .name {
    font-family: var(--font-serif);
    font-size: var(--text-2xl);
    line-height: var(--text-2xl--line-height);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  /* The written AI disclosure: in view before the call and for all of it. */
  .disclosure {
    margin: 0;
    font-family: var(--font-serif);
    font-size: var(--text-xl);
    line-height: var(--text-xl--line-height);
    text-wrap: balance;
  }

  /* The Business's own privacy notice, when it has given one: a small line under the disclosure. */
  .privacy { margin: 0; font-size: var(--text-xs); line-height: var(--text-xs--line-height); }
  .privacy a { color: var(--color-foam-muted); text-decoration: underline; text-underline-offset: 0.15em; }
  .privacy a:hover, .privacy a:focus-visible { color: var(--color-foam); }

  /* A compact Turn: the ring is this call, filling with time. */
  .instrument { position: relative; width: clamp(6.5rem, 24dvh, 9rem); aspect-ratio: 1; }
  .instrument svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--color-granite); stroke-width: 1; }
  /* The arc is lit only while the call is live; after it, the time the call took stays drawn in Foam faint. */
  .arc { fill: none; stroke: var(--color-foam-faint); stroke-width: 2; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  [data-state="live"] .arc { stroke: var(--live); }
  [data-state="start"] .arc, [data-state="connecting"] .arc { visibility: hidden; }
  .centre {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--spacing) * 1.5);
  }
  .clock { font-size: var(--text-2xl); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .label {
    font-size: var(--text-xs);
    line-height: var(--text-xs--line-height);
    font-weight: 500;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--color-foam-muted);
  }
  .speaker { display: inline-flex; align-items: center; gap: 0.5em; min-height: 1.4em; }

  /* The Live transcript: the previous line and the latest, shown only. It fills the space between the ring and the
     state and is cut at the top, so the newest words stay in view. The agent's latest line is Cable light while the
     call is live, never the Business's accent: that is adjusted for AA only against the text it carries, not against
     Deep sea. A finished line goes back to Foam muted: a colour, not opacity, so its label keeps AA contrast. */
  .turn {
    width: 100%; flex: 1 1 0; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; gap: calc(var(--spacing) * 2); text-align: left;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 1.5rem);
    mask-image: linear-gradient(to bottom, transparent, #000 1.5rem);
  }
  .turn p { margin: 0; font-size: var(--text-base); line-height: var(--text-base--line-height); color: var(--color-foam); overflow-wrap: anywhere; }
  [data-state="live"] .turn p[data-who="agent"]:last-child { color: var(--color-cable-light); }
  .turn p:not(:last-child) { color: var(--color-foam-muted); font-size: var(--text-sm); line-height: var(--text-sm--line-height); }
  .turn .label { display: block; margin-bottom: 0.125rem; }

  /* State: a dot and a label, then a sentence that says what to do. */
  .state { display: flex; flex-direction: column; align-items: center; gap: calc(var(--spacing) * 2); min-height: 4.5rem; }
  .chip { display: inline-flex; align-items: center; gap: 0.5em; }
  .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; border: 1.5px solid var(--color-foam-faint); flex: none; }
  .message { margin: 0; max-width: 30ch; font-size: var(--text-sm); line-height: var(--text-sm--line-height); color: var(--color-foam-muted); text-wrap: pretty; }

  [data-state="live"] .chip .dot,
  .speaker[data-who="agent"] .dot,
  .speaker[data-who="caller"] .dot { background: var(--live); border-color: var(--live); }
  [data-state="live"] .chip .label { color: var(--color-foam); }
  [data-state="connecting"] .chip .dot { border-color: var(--live); animation: wait 1.4s ease-in-out infinite; }
  [data-state="blocked"] .chip .dot,
  [data-state="failed"] .chip .dot { border-style: dashed; }
  .speaker { visibility: hidden; }
  [data-state="live"] .speaker { visibility: visible; }
  @keyframes wait { 50% { opacity: 0.25; } }

  .pill {
    font: 500 0.9375rem/1.2 var(--font-sans);
    width: 100%;
    max-width: 18rem;
    min-height: 3rem;
    padding: 0.75rem 1.25rem;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--action);
    color: var(--on-action);
    cursor: pointer;
    transition: background-color 0.2s ease-out, color 0.2s ease-out, border-color 0.2s ease-out;
  }
  .pill:hover { background: var(--action-hover); }
  .pill[aria-disabled="true"], .pill[aria-disabled="true"]:hover { cursor: progress; opacity: 0.6; background: var(--action); }
  /* Hanging up is the quiet ghost: the live thing is the call, not the button. */
  [data-state="live"] .pill { background: transparent; color: var(--color-foam); box-shadow: inset 0 0 0 1px var(--color-foam-faint); }
  [data-state="live"] .pill:hover { box-shadow: inset 0 0 0 1px var(--color-foam-muted); }

  .fine { margin: 0; font-size: var(--text-xs); line-height: var(--text-xs--line-height); color: var(--color-foam-muted); }

  /* A phone on its side leaves the panel under 420px tall: the ring gives way so the button stays in view. */
  @media (max-height: 420px) { .instrument { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .arc, .pill { transition: none; }
    [data-state="connecting"] .chip .dot { animation: none; }
  }
</style>
</head>
<body>
<main class="panel" id="panel" data-state="start">
  <h1 class="brand">__BRAND__</h1>
  <p class="disclosure">You are talking to an AI assistant.</p>
  __PRIVACY__
  <div class="instrument" aria-hidden="true">
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="48"/><circle class="arc" id="arc" cx="50" cy="50" r="48" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/></svg>
    <div class="centre">
      <span class="clock" id="clock">0:00</span>
      <span class="speaker label" id="speaker" data-who=""><span class="dot"></span><span id="speaker-name">Listening</span></span>
    </div>
  </div>
  <div class="turn" id="turn" role="log" aria-live="off" aria-label="Live transcript"></div>
  <div class="state" role="status" aria-live="polite">
    <span class="chip"><span class="dot"></span><span class="label" id="chip">Ready</span></span>
    <p class="message" id="message">Press Start call and allow your microphone when your browser asks.</p>
  </div>
  <button id="go" class="pill" type="button">Start call</button>
  <p class="fine">The call uses your microphone.</p>
</main>
<script>
// ponytail: plain page and a hand-written audio path; swap for Pipecat's browser client if barge-in or reconnects need more than this.
const IN_RATE = __IN_RATE__, OUT_RATE = __OUT_RATE__, MAX_CALL_SECS = __MAX_CALL_SECS__;
const go = document.getElementById("go"), panel = document.getElementById("panel");
let call = null;

// Every state the page can be in: its label, what it tells the Caller, and the button.
const STATES = {
  start: ["Ready", "Press Start call and allow your microphone when your browser asks.", "Start call"],
  connecting: ["Connecting", "Allow your microphone if your browser asks.", "Connecting…"],
  live: ["Live", "Speak whenever you like. The agent hears you.", "Hang up"],
  ended: ["Call ended", "Thank you for calling.", "Call again"],
  blocked: ["Microphone blocked", "Your browser blocked the microphone. Allow it for this page, then try again.", "Try again"],
  failed: ["Couldn't connect", "The call couldn't connect. Check your connection and try again.", "Try again"],
};
function show(state) {
  const [chip, message, button] = STATES[state];
  panel.dataset.state = state;
  document.getElementById("chip").textContent = chip;
  document.getElementById("message").textContent = message;
  go.textContent = button;
  // aria-disabled, not disabled: a disabled button drops the keyboard focus, and Hang up would have to be found again.
  go.setAttribute("aria-disabled", String(state === "connecting"));
}

// The ring and clock: time since the call went live, out of the core's cap.
const arc = document.getElementById("arc"), clock = document.getElementById("clock");
const speaker = document.getElementById("speaker"), speakerName = document.getElementById("speaker-name");
function tick(secs) {
  clock.textContent = `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, "0")}`;
  arc.style.strokeDashoffset = String(1000 - Math.min(1, secs / MAX_CALL_SECS) * 1000);
}
function speaking(who) {
  if (speaker.dataset.who === who) return;
  speaker.dataset.who = who;
  speakerName.textContent = who === "agent" ? "Agent" : who === "caller" ? "You" : "Listening";
}

// The Live transcript, kept in the page only and gone when it closes: the previous line and the latest.
// A line is one speaker's words until the other speaks; the agent's come in pieces that carry their own spaces.
const turn = document.getElementById("turn");
let lines = [];
function heard(who, text) {
  const last = lines[lines.length - 1];
  if (last && last.who === who) last.text += who === "caller" ? ` ${text}` : text;
  else lines = [...lines.slice(-1), { who, text: text.trimStart() }];
  turn.replaceChildren(...lines.map((l) => {
    const p = document.createElement("p"), label = document.createElement("span");
    p.dataset.who = l.who;
    label.className = "label";
    label.textContent = l.who === "agent" ? "Agent" : "You";
    p.append(label, l.text.length > 160 ? `…${l.text.slice(-160)}` : l.text);
    return p;
  }));
}

// Runs in the audio thread: hands the microphone over in blocks of 2048 samples.
const WORKLET = `class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(2048); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) for (const s of ch) {
      this.buf[this.n++] = s;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice()); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("tap", Tap);`;

// Averages the microphone's own rate down to IN_RATE, keeping the leftover between blocks so
// rates like 44.1 kHz stay in step, and packs 16-bit little-endian samples.
function resampler(fromRate) {
  const ratio = fromRate / IN_RATE;
  let tail = new Float32Array(0), pos = 0;
  return (block) => {
    const buf = new Float32Array(tail.length + block.length), out = [];
    buf.set(tail);
    buf.set(block, tail.length);
    while (pos + ratio <= buf.length) {
      const from = Math.floor(pos), to = Math.max(from + 1, Math.floor(pos + ratio));
      let sum = 0;
      for (let j = from; j < to; j++) sum += buf[j];
      out.push(Math.max(-1, Math.min(1, sum / (to - from))) * 0x7fff);
      pos += ratio;
    }
    const keep = Math.floor(pos);
    tail = buf.slice(keep);
    pos -= keep;
    return Int16Array.from(out).buffer;
  };
}

// What the browser applied, for the call's log (voice/serve.py checks each field): the microphone's settings, the
// audio context, and the browser family and OS from fixed lists. The user-agent string itself never leaves the page.
async function browserFacts(stream, ctx) {
  const facts = { sample_rate: ctx.sampleRate }, s = stream.getAudioTracks()[0]?.getSettings() ?? {};
  for (const [key, name] of [["echoCancellation", "echo_cancellation"], ["noiseSuppression", "noise_suppression"], ["autoGainControl", "auto_gain_control"]]) {
    if (s[key] !== undefined) facts[name] = s[key];
  }
  // Whole milliseconds: enough to judge an echo delay, too coarse to tell one audio device from another.
  if (ctx.baseLatency !== undefined) facts.base_latency_ms = Math.round(ctx.baseLatency * 1000);
  if (ctx.outputLatency !== undefined) facts.output_latency_ms = Math.round(ctx.outputLatency * 1000);
  const ua = navigator.userAgent;
  facts.browser = /SamsungBrowser/.test(ua) ? "samsung" : /Edg(A|iOS)?\//.test(ua) ? "edge" : /Firefox|FxiOS/.test(ua) ? "firefox"
    : /Chrome|CriOS/.test(ua) ? "chrome" : /Safari/.test(ua) ? "safari" : "other";
  facts.os = /iPhone|iPad|iPod/.test(ua) ? "ios" : /Android/.test(ua) ? "android" : /CrOS/.test(ua) ? "chromeos"
    : /Macintosh/.test(ua) ? "macos" : /Windows/.test(ua) ? "windows" : /Linux/.test(ua) ? "linux" : "other";
  // The OS's major version only where it is not frozen: Chromium's own, iOS Safari's and Firefox's Android number
  // (Chrome reports Android 10, macOS 10 and Windows NT 10 whatever runs). Chromium's only on Android and macOS: on
  // Windows and Linux its platformVersion is not the OS number. A failed lookup loses the version only.
  // shortcut: whether Safari freezes the iOS number too is not checked; drop it if a call shows a stale one.
  let version = null;
  if (navigator.userAgentData) {
    if (facts.os === "android" || facts.os === "macos") {
      try {
        version = (await navigator.userAgentData.getHighEntropyValues(["platformVersion"])).platformVersion?.split(".")[0];
      } catch (e) {}
    }
  } else if (facts.os === "ios") version = ua.match(/OS (\d+)_/)?.[1];
  else if (facts.os === "android") version = ua.match(/Android (\d+)/)?.[1];
  if (/^\d{1,3}$/.test(version ?? "")) facts.os_version = Number(version);
  return facts;
}

async function start() {
  show("connecting");
  speaking("");
  tick(0);
  lines = [];
  turn.replaceChildren();
  let stream, ctx, ws;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    ctx = new AudioContext();
    await ctx.resume();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws${location.search}`);
    ws.binaryType = "arraybuffer";
    await new Promise((ok, fail) => { ws.onopen = ok; ws.onerror = () => fail(new Error("ws")); });
  } catch (e) {
    stream?.getTracks().forEach((t) => t.stop());
    ctx?.close();
    show(e.name === "NotAllowedError" ? "blocked" : "failed");
    return;
  }
  const tap = new AudioWorkletNode(ctx, "tap"), playing = new Set();
  // Chrome's echo cancelling removes only audio that arrives over WebRTC and plays in a media element,
  // not what an AudioContext plays itself, so with the speaker on the microphone heard the agent and
  // cut it off. The agent's audio therefore makes a round trip through a WebRTC connection to this page.
  const out = ctx.createMediaStreamDestination(), speakerOut = new Audio();
  const sender = new RTCPeerConnection(), receiver = new RTCPeerConnection();
  let loopback = "set_up";
  try {
    sender.onicecandidate = (e) => e.candidate && receiver.addIceCandidate(e.candidate);
    receiver.onicecandidate = (e) => e.candidate && sender.addIceCandidate(e.candidate);
    receiver.ontrack = (e) => { speakerOut.srcObject = e.streams[0]; speakerOut.play().catch(() => {}); };
    out.stream.getTracks().forEach((t) => sender.addTrack(t, out.stream));
    await sender.setLocalDescription(await sender.createOffer());
    await receiver.setRemoteDescription(sender.localDescription);
    await receiver.setLocalDescription(await receiver.createAnswer());
    await sender.setRemoteDescription(receiver.localDescription);
  } catch (e) {
    out.connect(ctx.destination);  // no echo cancelling this way, but the call still works
    loopback = "fell_back";
  }
  // The core waits for this first, before the microphone's audio: it goes in the call's log.
  let facts = {};
  try { facts = await browserFacts(stream, ctx); } catch (e) {}
  ws.send(JSON.stringify({ type: "browser", loopback, ...facts }));
  let next = 0, callerHeardAt = 0, gaps = 0;
  const down = resampler(ctx.sampleRate);
  tap.port.onmessage = (e) => {
    // Who is speaking, for the page only: the block's loudness, read before it is sent.
    let sq = 0;
    for (const s of e.data) sq += s * s;
    if (Math.sqrt(sq / e.data.length) > 0.02) callerHeardAt = performance.now();
    ws.readyState === 1 && ws.send(down(e.data));
  };
  ctx.createMediaStreamSource(stream).connect(tap);
  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      const msg = JSON.parse(e.data);
      if (msg.type === "transcript") heard(msg.speaker, msg.text);
      else if (msg.type === "interrupt") {  // the Caller spoke over the agent
        playing.forEach((s) => s.stop());
        next = 0;
      }
      return;
    }
    const pcm = new Int16Array(e.data), buf = ctx.createBuffer(1, pcm.length, OUT_RATE);
    buf.copyToChannel(Float32Array.from(pcm, (v) => v / 0x8000), 0);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(out);
    src.onended = () => playing.delete(src);
    // A playback gap: the agent's audio ran out and more came within a second, with no barge-in between (an
    // interrupt sets next to 0). shortcut: a new turn within a second of the agent's last audio counts too, and a
    // pause of a second or more inside one turn does not; tell turns apart if the counts ever look wrong.
    const dry = ctx.currentTime - next;
    if (next && dry > 0 && dry < 1) ws.send(JSON.stringify({ type: "playback_gaps", count: ++gaps }));
    next = Math.max(next, ctx.currentTime);
    src.start(next);
    next += buf.duration;
    playing.add(src);
  };
  const began = performance.now();
  const timer = setInterval(() => {
    tick((performance.now() - began) / 1000);
    speaking(playing.size ? "agent" : performance.now() - callerHeardAt < 400 ? "caller" : "");
  }, 100);
  function end() {
    call = null;
    clearInterval(timer);
    speaking("");
    stream.getTracks().forEach((t) => t.stop());
    speakerOut.srcObject = null;
    sender.close();
    receiver.close();
    ws.close();
    ctx.close();
    show("ended");
  }
  ws.onclose = () => call && end();
  call = end;
  show("live");
}
go.onclick = () => panel.dataset.state !== "connecting" && (call ? call() : start());
// Escape inside the panel never reaches the Business's page, where it closes the panel; here it hangs up.
document.addEventListener("keydown", (e) => e.key === "Escape" && call && call());
</script>
</body>
</html>
